<div>
  <input
    type="text"
    id="searchInput"
    placeholder="Search Blogs..."
    class="mb-4 rounded-lg bg-white border border-green-300 text-gray-600 text-sm p-2 w-full focus:outline-none focus:ring-2 focus:ring-green-300"
  />
</div>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const searchInput = document.getElementById("searchInput");
    if (!searchInput) return;

    searchInput.addEventListener("input", function () {
      const query = this.value.toLowerCase();
      const blogItems = document.querySelectorAll(".blog-item");

      blogItems.forEach(function (blog) {
        const title = blog.dataset.title?.toLowerCase() || "";
        const content = blog.dataset.content?.toLowerCase() || "";
        const author = blog.dataset.author?.toLowerCase() || "";
        const date = blog.dataset.date?.toLowerCase() || "";

        const matches =
          title.includes(query) ||
          content.includes(query) ||
          author.includes(query) ||
          date.includes(query);

        blog.style.display = matches ? "block" : "none";
      });
    });
  });
</script>
